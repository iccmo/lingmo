services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    # Cloud backup to S3-compatible storage (uncomment and set values to enable)
    # environment:
    #   S3_ENDPOINT: https://your-s3-endpoint.example.com
    #   S3_BUCKET: novel-writer-backups
    #   S3_ACCESS_KEY: your-access-key
    #   S3_SECRET_KEY: your-secret-key
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/status', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
