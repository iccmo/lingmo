[project]
name = "novel-writer"
version = "0.3.0"
description = "灵墨 — AI 创作伴侣：小说、听书、剧本、短剧"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "openai>=1.66.0",
    "edge-tts>=6.1.0",
    "ebooklib>=0.18",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.10.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "novel_writer.routers.novel"
disable_error_code = ["union-attr", "return-value"]

[[tool.mypy.overrides]]
module = "novel_writer.routers.audiobook"
disable_error_code = ["return-value"]

[[tool.mypy.overrides]]
module = "novel_writer.routers.script"
disable_error_code = ["return-value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["novel_writer"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 27
show_missing = true
