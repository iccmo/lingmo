name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy httpx edge-tts

      - name: Lint (critical errors)
        run: ruff check novel_writer/ --select F821,F401,F811

      - name: Type check
        run: mypy novel_writer/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_generator.py \
            --ignore=tests/test_pipeline.py \
            --cov=novel_writer --cov-report=term-missing --cov-fail-under=27 \
            -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Test
        run: cd frontend && npm test -- --run

      - name: Build
        run: cd frontend && npm run build
